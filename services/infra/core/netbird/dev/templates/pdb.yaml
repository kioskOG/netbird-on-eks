{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "netbird.fullname" . }}
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "netbird.selectorLabels" . | nindent 6 }}
{{- end }}
