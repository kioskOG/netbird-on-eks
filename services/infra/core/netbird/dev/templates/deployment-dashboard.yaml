apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "netbird.fullname" . }}-dashboard
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "netbird.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "netbird.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: {{ include "netbird.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.dashboard.podSecurityContext | nindent 8 }}
      containers:
        - name: dashboard
          securityContext:
            {{- toYaml .Values.dashboard.securityContext | nindent 12 }}
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.port }}
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          env:
            - name: NETBIRD_MGMT_API_ENDPOINT
              value: "{{ .Values.global.protocol }}://{{ .Values.global.domain }}"
            - name: NETBIRD_MGMT_GRPC_API_ENDPOINT
              value: "{{ .Values.global.protocol }}://{{ .Values.global.domain }}"
            - name: AUTH_AUDIENCE
              value: "{{ .Values.oidc.audience }}"
            - name: AUTH_CLIENT_ID
              value: "{{ .Values.oidc.clientId }}"
            - name: AUTH_AUTHORITY
              value: {{ .Values.oidc.authority | default (printf "%s://%s/oauth2" .Values.global.protocol .Values.global.domain) | quote }}
            - name: USE_AUTH0
              value: "false"
            - name: AUTH_SUPPORTED_SCOPES
              value: "{{ .Values.oidc.supportedScopes }}"
            - name: AUTH_REDIRECT_URI
              value: "/nb-auth"
            - name: AUTH_SILENT_REDIRECT_URI
              value: "/nb-silent-auth"
            - name: NGINX_SSL_PORT
              value: "443"
            - name: LETSENCRYPT_DOMAIN
              value: "none"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
