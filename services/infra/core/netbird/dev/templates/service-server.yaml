apiVersion: v1
kind: Service
metadata:
  name: {{ include "netbird.fullname" . }}-server
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
    - port: {{ .Values.server.healthPort }}
      targetPort: health
      protocol: TCP
      name: health
  selector:
    {{- include "netbird.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
