apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: netbird-pg-credentials
  namespace: netbird
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: netbird-pg-app
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: dev/netbird/postgresql
        property: username
    - secretKey: password
      remoteRef:
        key: dev/netbird/postgresql
        property: password
