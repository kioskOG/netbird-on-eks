{{- if .Values.secrets.create }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "netbird.fullname" . }}-keys
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "netbird.fullname" . }}-keys
    creationPolicy: Owner
  data:
    - secretKey: NETBIRD_AUTH_SECRET
      remoteRef:
        key: {{ .Values.secrets.awsSecretName }}
        property: auth-secret
    - secretKey: NETBIRD_DATASTORE_ENCRYPTION_KEY
      remoteRef:
        key: {{ .Values.secrets.awsSecretName }}
        property: datastore-encryption-key
    - secretKey: NETBIRD_SESSION_COOKIE_ENCRYPTION_KEY
      remoteRef:
        key: {{ .Values.secrets.awsSecretName }}
        property: session-cookie-encryption-key
{{- end }}
