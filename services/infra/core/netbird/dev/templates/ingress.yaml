{{- if .Values.ingress.enabled -}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "netbird.fullname" . }}-http
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    alb.ingress.kubernetes.io/group.name: "netbird"
    alb.ingress.kubernetes.io/group.order: "20"
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: {{ .Values.server.metricsPort | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: /metrics
    alb.ingress.kubernetes.io/success-codes: "200"
    {{- with .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ . | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          - path: /relay
            pathType: Prefix
            backend:
              service:
                name: {{ include "netbird.fullname" . }}-server
                port:
                  number: 80
          - path: /ws-proxy
            pathType: Prefix
            backend:
              service:
                name: {{ include "netbird.fullname" . }}-server
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "netbird.fullname" . }}-server
                port:
                  number: 80
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: {{ include "netbird.fullname" . }}-server
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "netbird.fullname" . }}-grpc
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    alb.ingress.kubernetes.io/group.name: "netbird"
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    # Port 80 speaks HTTP/2. The metrics port is HTTP/1 only, so an HTTP2
    # target group fails its health check there.
    alb.ingress.kubernetes.io/healthcheck-port: {{ .Values.server.port | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: /oauth2/.well-known/openid-configuration
    alb.ingress.kubernetes.io/success-codes: "200"
    {{- with .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ . | quote }}
    {{- end }}
    {{- toYaml .Values.ingress.grpcAnnotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          - path: /signalexchange.SignalExchange/
            pathType: Prefix
            backend:
              service:
                name: {{ include "netbird.fullname" . }}-server
                port:
                  number: 80
          - path: /management.ManagementService/
            pathType: Prefix
            backend:
              service:
                name: {{ include "netbird.fullname" . }}-server
                port:
                  number: 80
          - path: /management.ProxyService/
            pathType: Prefix
            backend:
              service:
                name: {{ include "netbird.fullname" . }}-server
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "netbird.fullname" . }}-dashboard
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    alb.ingress.kubernetes.io/group.name: "netbird"
    alb.ingress.kubernetes.io/group.order: "30"
    alb.ingress.kubernetes.io/healthcheck-path: /
    {{- with .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ . | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "netbird.fullname" . }}-dashboard
                port:
                  number: 80
{{- end }}
