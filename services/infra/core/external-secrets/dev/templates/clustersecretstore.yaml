apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "aws.region must be set (values.local.yaml)" .Values.aws.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ index .Values "external-secrets" "serviceAccount" "name" | default "external-secrets" }}
            namespace: {{ .Release.Namespace }}
